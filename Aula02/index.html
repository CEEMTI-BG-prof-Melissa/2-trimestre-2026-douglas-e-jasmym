<!DOCTYPE html>
<html lang="pt-br">
<head>
</head>
<body>
    <h1>Realize o seu Cadastro</h1>
    <form action="index.hrml" method="get">
        <label for="nome">Nome: </label>
        <input type="text" id="nome" name="nome"> <br> 
        <p>Qual turno você prefere estudar?</p>
        <label for="manha"> </label>
        <input type="radio" id="manha" name="manha">Manhã <br> 
        <label for="tarde"> </label>
        <input type="radio" id="tarde" name="tarde">Tarde <br> 
        <label for="noite"> </label>
        <input type="radio" id="noite" name="noite">Noite <br> 
        <p>Quais áreas da tecnologias você tem interesse?</p>
        <label for="programacao"> </label>
        <input type="radio" id="programcao" name="programacao">Programação <br> 
        <label for="design"> </label>
        <input type="checkbox" id="design" name="design">Design <br> 
        <label for="bancodedados"> </label>
        <input type="checkbox" id="bancodedados" name="bancodedados">Banco de Dados <br> 
        <label for="redes"> </label>
        <input type="checkbox" id="redes" name="redes">Redes <br> 
        <p>Qual a sua cor favorita?<input type="color"></p> <br> 
        <p>Qual o seu nível de satisfação?<input type="range"></p> <br> 
        <p>Qual o seu horário preferido?<input type="time"></p> <br>
        <p>Envie um arquivo<input type="file"></p> <br> 
        <input type="submit" value="Cadastrar"> 
        <input type="reset" value="Limpar">
    </form>
</body>
</html>
